<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.json?v=7">
<title>我的理財管家 v7</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif;background:#f5f7fb;color:#172033}
.wrap{max-width:760px;margin:auto;padding:18px 14px 40px}
h1{font-size:27px;margin:4px 0 3px}.sub{color:#6b7280;font-size:13px;margin-bottom:15px}
.card{background:#fff;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 3px 16px #0000000b}
.monthbox{background:#111827;color:white;border-radius:20px;padding:16px}
.month-title{font-size:13px;opacity:.8;margin-bottom:10px}
.month-row{display:grid;grid-template-columns:48px 1fr 48px;gap:8px;align-items:center}
.month-btn{border:0;border-radius:12px;background:#374151;color:#fff;height:44px;font-size:22px}
.month-select{height:44px;border:0;border-radius:12px;background:#fff;color:#111827;text-align:center;font-size:17px;font-weight:700;padding:0 10px}
.month-actions{display:flex;gap:8px;margin-top:10px}
.today-btn{flex:1;border:1px solid #4b5563;background:transparent;color:white;border-radius:11px;padding:9px}
.future-badge{display:inline-block;background:#fbbf24;color:#111827;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:700;margin-top:9px}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.metric{background:#f8fafc;border-radius:14px;padding:13px}.metric b{display:block;font-size:21px;margin-top:4px}
.label{font-size:12px;color:#6b7280}
.pools{display:grid;grid-template-columns:1fr;gap:11px}
.pool{border:1px solid #e5e7eb;border-radius:15px;padding:13px}
.pool-head{display:flex;justify-content:space-between;gap:8px}.pool-name{font-weight:700}.remain{font-weight:700}
.bar{height:9px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin:9px 0 6px}.fill{height:100%;border-radius:99px;background:#111827}
.pool-foot{display:flex;justify-content:space-between;color:#6b7280;font-size:12px}
button,.primary{font:inherit}
form{display:grid;gap:10px}
input,select{width:100%;padding:12px;border:1px solid #d7dce5;border-radius:11px;background:#fff;font-size:15px}
.primary{border:0;border-radius:12px;padding:12px;background:#111827;color:white;font-weight:700}
.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.detail{border-top:1px solid #edf0f4;padding:10px 0;display:flex;justify-content:space-between;gap:10px}
.detail:first-child{border-top:0}.muted{color:#6b7280;font-size:12px}
.amount{font-weight:700;white-space:nowrap}
.empty{text-align:center;color:#9ca3af;padding:18px}
.danger{border:0;background:#fee2e2;color:#991b1b;border-radius:8px;padding:5px 8px}
.small{font-size:12px;color:#6b7280}
@media(min-width:600px){.pools{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="wrap">
<h1>我的理財管家</h1>
<div class="sub">v7｜月份獨立記帳版</div>

<section class="monthbox">
  <div class="month-title">📅 目前查看的記帳月份</div>
  <div class="month-row">
    <button class="month-btn" id="prevBtn">‹</button>
    <select class="month-select" id="monthSelect"></select>
    <button class="month-btn" id="nextBtn">›</button>
  </div>
  <div class="month-actions">
    <button class="today-btn" id="currentBtn">回到本月</button>
  </div>
  <div id="futureBadge"></div>
</section>

<section class="card">
  <div class="summary">
    <div class="metric"><span class="label">本月總支出</span><b id="monthTotal">$0</b></div>
    <div class="metric"><span class="label">本月變動預算</span><b>$26,900</b></div>
    <div class="metric"><span class="label">本月剩餘預算</span><b id="monthRemain">$26,900</b></div>
    <div class="metric"><span class="label">預備金</span><b>$115,000</b></div>
  </div>
</section>

<section class="card">
<h2>三大支付池</h2>
<div class="pools">
  <div class="pool">
    <div class="pool-head"><span class="pool-name">💳 信用卡</span><span class="remain" id="cardRemain">$18,000</span></div>
    <div class="bar"><div class="fill" id="cardBar"></div></div>
    <div class="pool-foot"><span>已支出 <b id="cardSpent">$0</b></span><span>額度 $18,000</span></div>
  </div>
  <div class="pool">
    <div class="pool-head"><span class="pool-name">💵 現金</span><span class="remain" id="cashRemain">$5,000</span></div>
    <div class="bar"><div class="fill" id="cashBar"></div></div>
    <div class="pool-foot"><span>已支出 <b id="cashSpent">$0</b></span><span>額度 $5,000</span></div>
  </div>
  <div class="pool">
    <div class="pool-head"><span class="pool-name">📱 Taiwan Pay</span><span class="remain" id="twRemain">$3,900</span></div>
    <div class="bar"><div class="fill" id="twBar"></div></div>
    <div class="pool-foot"><span>已支出 <b id="twSpent">$0</b></span><span>額度 $3,900</span></div>
  </div>
</div>
</section>

<section class="card">
<h2>新增支出</h2>
<form id="form">
<div class="row">
<input id="date" type="date" required>
<input id="amount" type="number" min="0" step="1" placeholder="金額" required>
</div>
<div class="row">
<select id="pool">
<option value="card">信用卡</option>
<option value="cash">現金</option>
<option value="tw">Taiwan Pay</option>
</select>
<select id="card">
<option value="">不適用</option>
<option>台新</option>
<option>聯邦國旅卡</option>
</select>
</div>
<div class="row">
<select id="category">
<option>交通</option><option>飲食</option><option>運動</option><option>購物</option><option>咖啡娛樂</option><option>其他</option>
</select>
<input id="note" placeholder="備註（選填）">
</div>
<button class="primary">＋ 新增支出</button>
</form>
<div class="small" style="margin-top:9px">💡 可以直接選未來月份，先把預計支出記進去；每個月份的支出池會各自計算。</div>
</section>

<section class="card">
<h2 id="detailTitle">本月明細</h2>
<div id="details"></div>
</section>
</div>

<script>
const KEY='ly-budget-pwa-v7-data';
const OLD_KEYS=['ly-budget-pwa-v6','ly-budget-pwa-v5','ly-budget-pwa-v4','ly-budget-pwa-v3','ly-budget-pwa'];
const BUDGET={card:18000,cash:5000,tw:3900};
const TOTAL_BUDGET=26900;
let data=[]; let selectedMonth='';

const money=n=>'$'+Number(n||0).toLocaleString('zh-TW');
function pad(n){return String(n).padStart(2,'0')}
function ymNow(){let d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)}
function normalizeDate(d){
 if(!d)return '';
 d=String(d);
 if(/^\\d{4}-\\d{2}-\\d{2}$/.test(d))return d;
 if(/^\\d{4}-\\d{2}$/.test(d))return d+'-01';
 let x=new Date(d); if(isNaN(x))return '';
 return x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate());
}
function monthLabel(ym){
 let [y,m]=ym.split('-'); return `${y} 年 ${Number(m)} 月`;
}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function load(){
 try{data=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){data=[]}
 if(!Array.isArray(data))data=[];
 if(!data.length){
   for(const k of OLD_KEYS){
     try{
       const x=JSON.parse(localStorage.getItem(k)||'[]');
       if(Array.isArray(x)&&x.length){data.push(...x.map(v=>({...v,date:normalizeDate(v.date||v.datetime||v.time)})));break}
     }catch(e){}
   }
 }
 data=data.filter(x=>normalizeDate(x.date)).map(x=>({...x,date:normalizeDate(x.date)}));
 localStorage.setItem(KEY,JSON.stringify(data));
 selectedMonth=localStorage.getItem('ly-budget-pwa-v7-month')||ymNow();
}
function save(){localStorage.setItem(KEY,JSON.stringify(data));localStorage.setItem('ly-budget-pwa-v7-month',selectedMonth)}

function monthList(){
 const set=new Set(); const now=new Date();
 for(let i=-6;i<=18;i++){
   let d=new Date(now.getFullYear(),now.getMonth()+i,1);
   set.add(d.getFullYear()+'-'+pad(d.getMonth()+1));
 }
 data.forEach(x=>set.add(x.date.slice(0,7)));
 return [...set].sort();
}
function renderMonthSelect(){
 const list=monthList();
 if(!list.includes(selectedMonth))list.push(selectedMonth);
 list.sort();
 monthSelect.innerHTML=list.map(m=>`<option value="${m}">${monthLabel(m)}</option>`).join('');
 monthSelect.value=selectedMonth;
 futureBadge.innerHTML=selectedMonth>ymNow()?'<span class="future-badge">📌 預先登錄月份</span>':'';
}
function monthItems(){return data.filter(x=>x.date.slice(0,7)===selectedMonth)}
function sum(pool,items){return items.filter(x=>x.pool===pool).reduce((a,x)=>a+Number(x.amount||0),0)}
function render(){
 renderMonthSelect();
 const items=monthItems();
 const ct=sum('card',items), ca=sum('cash',items), tw=sum('tw',items);
 const total=ct+ca+tw;
 monthTotal.textContent=money(total);
 monthRemain.textContent=money(Math.max(TOTAL_BUDGET-total,0));
 document.querySelector('.metric:nth-child(3) .label').textContent=selectedMonth===ymNow()?'本月剩餘預算':`${monthLabel(selectedMonth)}剩餘預算`;
 const vals=[['card',ct,18000,'cardSpent','cardRemain','cardBar'],['cash',ca,5000,'cashSpent','cashRemain','cashBar'],['tw',tw,3900,'twSpent','twRemain','twBar']];
 vals.forEach(([p,spent,b,si,ri,bi])=>{
   document.getElementById(si).textContent=money(spent);
   document.getElementById(ri).textContent=money(Math.max(b-spent,0));
   document.getElementById(bi).style.width=Math.min(spent/b*100,100)+'%';
 });
 detailTitle.textContent=`${monthLabel(selectedMonth)}支出明細`;
 if(!items.length){details.innerHTML='<div class="empty">這個月份目前沒有支出紀錄</div>';return}
 items.sort((a,b)=>b.date.localeCompare(a.date));
 details.innerHTML=items.map((x,i)=>{
   const poolName=x.pool==='card'?'信用卡':x.pool==='cash'?'現金':'Taiwan Pay';
   const extra=x.pool==='card'&&x.card?`｜${esc(x.card)}`:'';
   return `<div class="detail">
     <div><b>${esc(x.category||'其他')}</b><div class="muted">${esc(x.date)}｜${poolName}${extra}${x.note?'｜'+esc(x.note):''}</div></div>
     <div style="text-align:right"><div class="amount">${money(x.amount)}</div><button class="danger" onclick="removeItem('${esc(x.id)}')">刪除</button></div>
   </div>`
 }).join('');
}
function removeItem(id){
 data=data.filter(x=>String(x.id)!==String(id));save();render();
}
function shiftMonth(delta){
 let [y,m]=selectedMonth.split('-').map(Number);
 let d=new Date(y,m-1+delta,1);
 selectedMonth=d.getFullYear()+'-'+pad(d.getMonth()+1);
 save();render();
}
prevBtn.onclick=()=>shiftMonth(-1);
nextBtn.onclick=()=>shiftMonth(1);
currentBtn.onclick=()=>{selectedMonth=ymNow();save();render()};
monthSelect.onchange=()=>{selectedMonth=monthSelect.value;save();render()};

form.onsubmit=e=>{
 e.preventDefault();
 const dateVal=date.value, amountVal=Number(amount.value);
 if(!dateVal||!amountVal||amountVal<0)return;
 const item={id:Date.now().toString()+Math.random().toString(16).slice(2),date:dateVal,amount:amountVal,pool:pool.value,card:pool.value==='card'?card.value:'',category:category.value,note:note.value.trim()};
 data.push(item); selectedMonth=dateVal.slice(0,7); save();
 form.reset(); date.value=dateVal; render();
};

load();
date.value=new Date().toISOString().slice(0,10);
render();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js?v=7').catch(()=>{});
</script>
</body>
</html>
